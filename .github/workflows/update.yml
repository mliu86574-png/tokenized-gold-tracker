name: update-data
on:
  schedule:
    - cron: "17 1 * * *"     # daily at 01:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["src/**", "config.json", "tests/**", "notes.md", ".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Fetch data and rebuild dashboard
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python -m goldtrack.build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md
          git diff --cached --quiet || git commit -m "Daily data update"
          git pull --rebase --autostash || true
          git push
